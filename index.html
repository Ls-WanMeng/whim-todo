<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Whim Todo：极光玻璃质感的本地待办清单，支持明暗主题、拖拽排序、导入导出与撤销。" />
    <meta name="theme-color" content="#0b1120" />
    <script>
      // 首屏防闪色：在绘制前用与 src/lib/themes.ts 相同的规则定下 data-theme，改主题时两处一起改
      (function () {
        var DARK = ["abyss", "dune", "tundra", "neon", "contrast"];
        var LIGHT = ["mist", "paper", "sakura"];
        var PAIR = { dark: "abyss", light: "mist" };
        function valid(id, list) {
          return typeof id === "string" && list.indexOf(id) !== -1;
        }
        var pref = null;
        var pair = PAIR;
        try {
          pref = localStorage.getItem("whim-todo:theme");
          var savedPair = JSON.parse(localStorage.getItem("whim-todo:theme-pair") || "null");
          if (savedPair) {
            pair = {
              dark: valid(savedPair.dark, DARK) ? savedPair.dark : PAIR.dark,
              light: valid(savedPair.light, LIGHT) ? savedPair.light : PAIR.light
            };
          }
          if (pref === null && localStorage.getItem("dsh-demo-theme") === "light") {
            pref = "mist";
          }
        } catch (e) {}
        if (!valid(pref, DARK.concat(LIGHT))) {
          var prefersDark = !window.matchMedia("(prefers-color-scheme: light)").matches;
          pref = prefersDark ? pair.dark : pair.light;
        }
        document.documentElement.dataset.theme = pref;
      })();
    </script>
    <meta property="og:title" content="Whim Todo · 待办清单" />
    <meta property="og:description" content="极光玻璃质感的本地待办清单，数据保存在浏览器。" />
    <meta property="og:type" content="website" />
    <title>Whim Todo · 待办清单</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
